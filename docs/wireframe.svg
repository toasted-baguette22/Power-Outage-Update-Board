<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif" font-size="12">
  <title>Wireframes - Power Outage Update Board</title>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold">Desktop (&gt;= 1000px)</text>
  <g fill="#f4f5f7" stroke="#333" stroke-width="1.5">
    <rect x="20" y="36" width="640" height="500"/>
    <rect x="20" y="36" width="640" height="46" fill="#cfe0f2"/>
  </g>
  <text x="32" y="64" font-size="14" font-weight="bold">Power Outage Update Board</text>
  <text x="500" y="64">[clock]  [x] Utility desk view</text>
  <g fill="#fff" stroke="#333">
    <rect x="32" y="94" width="145" height="40"/><rect x="185" y="94" width="145" height="40"/>
    <rect x="338" y="94" width="145" height="40"/><rect x="491" y="94" width="157" height="40"/>
  </g>
  <g font-size="10"><text x="38" y="118">Active outages</text><text x="191" y="118">Awaiting verif.</text><text x="344" y="118">Avg restoration</text><text x="497" y="118">Most affected zone</text></g>
  <rect x="32" y="144" width="400" height="380" fill="#fff" stroke="#333"/>
  <text x="42" y="164" font-weight="bold">Outage reports</text>
  <g fill="#eee" stroke="#666"><rect x="42" y="172" width="120" height="22"/><rect x="170" y="172" width="120" height="22"/><rect x="298" y="172" width="120" height="22"/><rect x="42" y="200" width="120" height="22"/><rect x="170" y="200" width="120" height="22"/><rect x="298" y="200" width="70" height="22"/></g>
  <g font-size="10"><text x="48" y="187">Search</text><text x="176" y="187">Zone</text><text x="304" y="187">Status</text><text x="48" y="215">Service</text><text x="176" y="215">Sort</text><text x="304" y="215">Clear</text><text x="42" y="244">Showing n of N reports</text></g>
  <g fill="#fff" stroke="#333"><rect x="42" y="254" width="188" height="130"/><rect x="238" y="254" width="188" height="130"/><rect x="42" y="392" width="188" height="120"/><rect x="238" y="392" width="188" height="120"/></g>
  <g font-size="10"><text x="50" y="272" font-weight="bold">Zone D  [Verified]</text><text x="50" y="290">started / ongoing for</text><text x="50" y="306">description...</text><text x="50" y="322">(chip)(chip)</text><text x="50" y="338">Recovery estimate</text><text x="50" y="356">[I see this too] [Timeline]</text>
  <text x="246" y="272" font-weight="bold">Zone E  [Crew]</text><text x="50" y="410">Card 3</text><text x="246" y="410">Card 4</text></g>
  <rect x="446" y="144" width="204" height="380" fill="#fff" stroke="#333"/>
  <text x="456" y="164" font-weight="bold">Report an outage</text>
  <g fill="#eee" stroke="#666"><rect x="456" y="174" width="184" height="20"/><rect x="456" y="202" width="184" height="20"/><rect x="456" y="230" width="184" height="20"/><rect x="456" y="258" width="184" height="20"/><rect x="456" y="340" width="184" height="50"/></g>
  <g font-size="10"><text x="462" y="188">Zone</text><text x="462" y="216">Name</text><text x="462" y="244">Email</text><text x="462" y="272">Started (date/time)</text><text x="456" y="300">( ) Partial  ( ) Full</text><text x="456" y="318">[ ] services checklist</text><text x="462" y="356">Description</text></g>
  <rect x="456" y="404" width="90" height="24" fill="#0b4f8a"/><text x="470" y="420" fill="#fff">Submit</text>
  <text x="456" y="450" font-size="10">(sticky column)</text>

  <text x="700" y="24" font-size="16" font-weight="bold">Mobile (&lt; 640px)</text>
  <rect x="700" y="36" width="200" height="500" fill="#f4f5f7" stroke="#333" stroke-width="1.5"/>
  <rect x="700" y="36" width="200" height="40" fill="#cfe0f2" stroke="#333"/>
  <text x="708" y="60" font-weight="bold">Outage Board</text>
  <g fill="#fff" stroke="#333"><rect x="708" y="84" width="90" height="30"/><rect x="802" y="84" width="90" height="30"/><rect x="708" y="118" width="90" height="30"/><rect x="802" y="118" width="90" height="30"/></g>
  <text x="712" y="104" font-size="10">Active</text><text x="806" y="104" font-size="10">Unverified</text><text x="712" y="138" font-size="10">Avg time</text><text x="806" y="138" font-size="10">Top zone</text>
  <rect x="708" y="156" width="184" height="170" fill="#fff" stroke="#333"/>
  <text x="714" y="174" font-weight="bold" font-size="11">Report an outage (form)</text>
  <g fill="#eee" stroke="#666"><rect x="714" y="182" width="172" height="16"/><rect x="714" y="204" width="172" height="16"/><rect x="714" y="226" width="172" height="16"/><rect x="714" y="248" width="172" height="40"/></g>
  <rect x="714" y="296" width="70" height="20" fill="#0b4f8a"/>
  <rect x="708" y="334" width="184" height="64" fill="#fff" stroke="#333"/>
  <text x="714" y="352" font-weight="bold" font-size="11">Filters (1 column)</text>
  <rect x="708" y="406" width="184" height="60" fill="#fff" stroke="#333"/><text x="714" y="424" font-size="10">Card 1 (full width)</text>
  <rect x="708" y="472" width="184" height="56" fill="#fff" stroke="#333"/><text x="714" y="490" font-size="10">Card 2 ...</text>
</svg>
